<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AA Live settings</title>
<style>
@font-face{font-family:"Minecraft";src:url(data:font/otf;base64,/*FONT_R*/) format("opentype");font-weight:400 500}
@font-face{font-family:"Minecraft";src:url(data:font/otf;base64,/*FONT_B*/) format("opentype");font-weight:600 800}
:root{--bg:#0d0e12;--panel:#15171d;--field:#1d2028;--hover:#262a34;--line:#2a2e38;--on:#2f6fe0;--on-dim:#1d3d78;--text:#eceef3;--dim:#8d94a5;--faint:#5d6475;
  --gold:#f5c542;--bad:#ef6b6b;--good:#55d68a;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Minecraft",ui-monospace,monospace;font-size:15px;line-height:1.4;-webkit-font-smoothing:none}
main{max-width:600px;margin:0 auto;padding:18px 20px 48px}
header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
h1{font-size:22px;margin:0;font-weight:700}
.status{color:var(--dim);font-size:13px;display:flex;align-items:center;gap:6px;min-width:0}
.status i{width:8px;height:8px;background:var(--faint);flex:none}
.status.on i{background:var(--good)}
.notes p{margin:8px 0 0;color:var(--gold);font-size:13px}
h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:600;margin:26px 0 8px}
.group{background:var(--panel);border:1px solid var(--line)}
.r{display:grid;grid-template-columns:118px minmax(0,1fr);gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line);min-height:52px}
.r:first-child{border-top:0}
.r > .k{color:var(--dim);font-size:14px}
.r > .v{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}
.hint{color:var(--faint);font-size:12px;width:100%}
input,button{font:inherit;color:var(--text)}
input[type=url],input[type=password],input[type=text]{flex:1;min-width:0;background:var(--field);border:1px solid var(--line);padding:7px 10px;outline:0}
input:focus-visible,button:focus-visible{outline:2px solid var(--on);outline-offset:1px}
button{background:var(--field);border:1px solid var(--line);padding:7px 12px;cursor:pointer;white-space:nowrap}
button:hover{background:var(--hover)}
/* a row of choices, one picked */
.seg{display:flex;flex:1;border:1px solid var(--line);background:var(--field);min-width:0}
.seg button{flex:1 1 auto;min-width:0;border:0;border-left:1px solid var(--line);background:transparent;padding:7px 6px;color:var(--dim)}
.seg button:first-child{border-left:0}
.seg button:hover{background:var(--hover);color:var(--text)}
.seg button.on{background:var(--on);color:#fff}
/* a slider with its number */
input[type=range]{flex:1;min-width:80px;accent-color:var(--on);margin:0;height:22px}
.num{display:flex;align-items:center;background:var(--field);border:1px solid var(--line)}
.num input{width:52px;background:transparent;border:0;padding:6px 2px 6px 8px;text-align:right;outline:0;-moz-appearance:textfield}
.num input::-webkit-inner-spin-button{display:none}
.num span{color:var(--dim);padding-right:8px}
.num button{border:0;background:transparent;padding:6px 10px;color:var(--dim)}
.num button:hover{color:var(--text);background:var(--hover)}
.chip.on{background:var(--on-dim);border-color:var(--on);color:#fff}
/* on / off */
.sw{position:relative;width:40px;height:22px;flex:none;appearance:none;-webkit-appearance:none;margin:0;background:var(--field);border:1px solid var(--line);cursor:pointer}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;background:var(--dim);transition:left .12s}
.sw:checked{background:var(--on);border-color:var(--on)}
.sw:checked::after{left:21px;background:#fff}
.lab{flex:1;cursor:pointer}
code{font:inherit;flex:1;min-width:0;background:var(--field);border:1px solid var(--line);padding:7px 10px;user-select:all;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lab code{display:inline;padding:1px 4px;border:0}
a{color:var(--text)}
.msg{font-size:13px;width:100%}
.msg:empty{display:none}
.msg.bad{color:var(--bad)}.msg.good{color:var(--good)}
/* (a narrow window: each setting's name above it) */
@media (max-width:540px){.r{grid-template-columns:1fr;gap:8px}}
.hide{display:none!important}
#saved{position:fixed;right:16px;bottom:14px;background:var(--panel);border:1px solid var(--line);padding:6px 12px;font-size:13px;color:var(--good);opacity:0;transition:opacity .2s;pointer-events:none}
#saved.show{opacity:1}#saved.bad{color:var(--bad)}
</style>
</head>
<body>
<main>
  <header><h1>AA Live</h1><span class="status" id="status"><i></i><span id="statusT">Connecting…</span></span></header>
  <div class="notes" id="notes"></div>

  <h2>Timer</h2>
  <div class="group">
    <div class="r"><span class="k">Compare with</span><div class="v"><div class="seg" id="comp">
      <button data-v="auto">Auto</button><button data-v="pb">PB</button><button data-v="avg">Average</button><button data-v="best">Best</button><button data-v="worst">Worst</button><button data-v="wr">WR</button></div></div></div>
    <div class="r"><span class="k">Digits</span><div class="v"><div class="seg" id="clock">
      <button data-v="s">1</button><button data-v="m">1:23</button><button data-v="h">1:23:45</button></div></div></div>
    <div class="r"><span class="k">Accuracy</span><div class="v"><div class="seg" id="ms">
      <button data-v="0">None</button><button data-v="1">.0</button><button data-v="2">.00</button><button data-v="3">.000</button></div></div></div>
  </div>

  <h2>Look</h2>
  <div class="group">
    <div class="r"><span class="k">Size</span><div class="v">
      <input type="range" id="scaleR" min="50" max="300" step="5" aria-label="Size">
      <span class="num"><input type="number" id="scaleN" min="50" max="300" step="5" aria-label="Size in percent"><span>%</span></span></div></div>
    <div class="r"><span class="k">Transparency</span><div class="v">
      <input type="range" id="bgR" min="0" max="100" step="1" aria-label="Transparency">
      <span class="num"><input type="number" id="bgN" min="0" max="100" step="1" aria-label="Transparency in percent"><span>%</span></span>
      <button class="chip" id="bgAuto" title="See-through in OBS, solid in the app">Auto</button></div></div>
    <div class="r"><span class="k">Splits shown</span><div class="v">
      <span class="num"><button id="rowsDn" aria-label="Fewer">−</button><input type="number" id="rows" min="2" max="30" step="1" aria-label="Splits shown" style="width:40px;text-align:center;padding:6px 0"><button id="rowsUp" aria-label="More">+</button></span></div></div>
    <div class="r hide" id="topRow"><span class="k">Window</span><div class="v">
      <input type="checkbox" class="sw" id="onTop"><label class="lab" for="onTop">Keep on top</label></div></div>
  </div>

  <h2>Stats site</h2>
  <div class="group">
    <div class="r"><span class="k">Link</span><div class="v">
      <input id="site" type="url" placeholder="https://you.github.io/your-site/" autocomplete="off" spellcheck="false"><button id="siteSave">Save</button>
      <span class="msg" id="siteMsg"></span></div></div>
    <div class="r"><span class="k">Upload runs</span><div class="v">
      <input type="checkbox" class="sw" id="upOn"><label class="lab" for="upOn">After <code>/seed</code> and leaving the world</label></div></div>
    <div class="r"><span class="k">GitHub token</span><div class="v">
      <input id="tok" type="password" autocomplete="off" spellcheck="false"><button id="tokSave">Save</button>
      <span class="msg" id="upMsg"></span></div></div>
  </div>

  <h2>OBS</h2>
  <div class="group">
    <div class="r"><span class="k">Browser source</span><div class="v">
      <code id="obsUrl"></code><button id="copy">Copy</button>
      <span class="hint" id="obsHint"></span></div></div>
    <div class="r hide" id="phoneRow"><span class="k">Phone</span><div class="v"><a id="phone" target="_blank" rel="noopener"></a></div></div>
  </div>

  <h2>About</h2>
  <div class="group">
    <div class="r"><span class="k">Version</span><div class="v"><span id="ver"></span><button id="upd" class="hide">Check for updates</button>
      <span class="msg" id="updMsg"></span></div></div>
    <div class="r"><span class="k">Bug report</span><div class="v"><button id="report">Save report</button>
      <a href="https://github.com/zesskyo/aa-no-reset-timer/issues/new" target="_blank" rel="noopener">Open an issue</a></div></div>
  </div>
</main>
<div id="saved" role="status">Saved</div>
<script>
"use strict";
const $ = id => document.getElementById(id), app = window.aaApp || null;   // (aaApp: in the AA Live app, see desktop/preload.cjs)
let S = null, filled = false;
const post = async body => { const r = await fetch("/settings", {method: "POST", body: JSON.stringify(body)}).catch(() => null); return !r ? "Couldn't reach AA Live" : r.ok ? "" : await r.text(); };
const say = (el, text, bad) => { el.textContent = text; el.className = "msg " + (bad ? "bad" : text ? "good" : ""); };
let savedT = null;
const flash = err => { const s = $("saved"); s.textContent = err || "Saved"; s.classList.toggle("bad", !!err); s.classList.add("show"); clearTimeout(savedT); savedT = setTimeout(() => s.classList.remove("show"), err ? 4000 : 1200); };

// ---------- How the timer looks: saved as it's changed (a slider's, a few times a second while it's dragged) ----------
const segVal = id => { const b = $(id).querySelector("button.on"); return b ? b.dataset.v : null; };
const setSeg = (id, v) => $(id).querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.v === String(v)));
const clamp = (v, a, b, d) => String(v).trim() !== "" && Number.isFinite(+v) ? Math.min(b, Math.max(a, Math.round(+v))) : d;
let bgAuto = true;
// (transparency is how see-through it is; what's kept is how black, 100 minus that, as in a link's ?bg=)
const look = () => ({comp: segVal("comp"), clock: segVal("clock"), ms: +segVal("ms"), rows: clamp($("rows").value, 2, 30, 8),
  scale: clamp($("scaleN").value, 50, 300, 100) / 100, bg: bgAuto ? null : 100 - clamp($("bgN").value, 0, 100, 0)});
let wait = null;
const saveLook = () => { if (!wait) wait = setTimeout(async () => { wait = null; flash(await post({display: look()})); }, 80); };
for (const id of ["comp", "clock", "ms"]) $(id).addEventListener("click", e => { const b = e.target.closest("button"); if (b) { setSeg(id, b.dataset.v); saveLook(); } });
// a slider and its number, kept the same
const pair = (r, n, lo, hi, then = () => {}) => {
  $(r).addEventListener("input", () => { $(n).value = $(r).value; then(); saveLook(); });
  $(n).addEventListener("change", () => { $(n).value = $(r).value = clamp($(n).value, lo, hi, +$(r).value); then(); saveLook(); });
};
const showAuto = () => { $("bgAuto").classList.toggle("on", bgAuto); };
pair("scaleR", "scaleN", 50, 300);
pair("bgR", "bgN", 0, 100, () => { bgAuto = false; showAuto(); });
$("bgAuto").onclick = () => { bgAuto = !bgAuto; showAuto(); saveLook(); };
const rows = d => { $("rows").value = clamp(+$("rows").value + d, 2, 30, 8); saveLook(); };
$("rowsDn").onclick = () => rows(-1); $("rowsUp").onclick = () => rows(1);
$("rows").addEventListener("change", () => rows(0));

// ---------- The stats site, uploading ----------
$("siteSave").onclick = async () => { const e = await post({site: $("site").value}); say($("siteMsg"), e, !!e); if (!e) flash(); };
$("upOn").onchange = async () => { const e = await post({site: S ? S.siteUrl || "" : $("site").value, autoUpload: $("upOn").checked}); say($("upMsg"), e, !!e); if (!e) flash(); };
$("tokSave").onclick = async () => { const e = await post({site: S ? S.siteUrl || "" : $("site").value, token: $("tok").value}); if (!e) { $("tok").value = ""; flash(); } say($("upMsg"), e, !!e); };
$("copy").onclick = () => { navigator.clipboard.writeText($("obsUrl").textContent).then(() => { $("copy").textContent = "Copied"; setTimeout(() => $("copy").textContent = "Copy", 1500); }, () => {}); };
$("report").onclick = () => { const a = document.createElement("a"); a.href = "/report.txt"; a.download = "aa-live-report.txt"; document.body.append(a); a.click(); a.remove(); };
// in the app: on top, and updates
if (app) {
  $("topRow").classList.remove("hide"); $("upd").classList.remove("hide");
  app.getOnTop().then(v => { $("onTop").checked = v; });
  $("onTop").onchange = () => app.setOnTop($("onTop").checked);
  $("upd").onclick = () => app.checkUpdate();
  app.onUpdate(t => say($("updMsg"), t, /Couldn't/.test(t)));
}

function fill() {
  const d = S.display || {};
  if (!filled) {
    filled = true;
    $("site").value = S.siteUrl || "";
    setSeg("comp", d.comp || "auto"); setSeg("clock", d.clock || "h"); setSeg("ms", d.ms ?? 3);
    $("rows").value = d.rows || 8;
    $("scaleR").value = $("scaleN").value = Math.round((d.scale || 1) * 100);
    bgAuto = d.bg == null; $("bgR").value = $("bgN").value = d.bg == null ? 0 : 100 - d.bg; showAuto();
  }
  const u = S.upload || {};
  if (document.activeElement !== $("upOn")) $("upOn").checked = !!u.on;
  $("tok").placeholder = u.token ? "Saved (type - to forget it)" : "Can change " + (u.repo || "the site's repository");
  if (u.msg) say($("upMsg"), u.msg, /Couldn't/.test(u.msg));
  $("obsUrl").textContent = `http://localhost:${S.port || 7476}/`;
  $("obsHint").textContent = `Width 440, height ${Math.round((180 + (d.rows || 8) * 36 + 160) * (d.scale || 1))}`;
  $("phoneRow").classList.toggle("hide", !S.phone); if (S.phone) { $("phone").href = $("phone").textContent = S.phone; }
  $("ver").textContent = app ? app.version : S.v;
  $("status").classList.toggle("on", !!S.world); $("statusT").textContent = S.world ? S.world : "Waiting for Minecraft";
  const notes = [!S.siteRuns ? "No runs to compare with yet." : "",
    S.updateReady ? "Update ready: it's put in place the next time AA Live starts." : "",
    S.oldHermes ? `Hermes ${S.oldHermes} doesn't log biomes: update to 0.14+.` : ""].filter(Boolean);
  $("notes").innerHTML = notes.map(n => `<p>${n}</p>`).join("");
}
const es = new EventSource("/events");
es.onmessage = e => { S = JSON.parse(e.data); fill(); };
</script>
</body>
</html>
