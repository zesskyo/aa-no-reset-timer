<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AA Live</title>
<style>
@font-face{font-family:"Minecraft";src:url(data:font/otf;base64,/*FONT_R*/) format("opentype");font-weight:400 500}
@font-face{font-family:"Minecraft";src:url(data:font/otf;base64,/*FONT_B*/) format("opentype");font-weight:600 800}
:root{
  --bg-alpha:0; --row:#16181e; --row-on:#24324a; --line:#262a33; --on:#1f5fd6;
  --text:#e9ecf1; --dim:#8a92a3; --faint:#5b6273;
  --ahead:#4cd07d; --behind:#ef5b5b; --gold:#f5c542; --blue:#6aa8ff;
}
*{box-sizing:border-box;border-radius:0}
button{-webkit-appearance:none;appearance:none}
html,body{margin:0}
html,body{background:transparent}
/* The Minecraft font is drawn on a grid of 1/10 of its size: text is only at sizes that are multiples of 10 (so its
   pixels land on whole screen pixels and it stays sharp), with Minecraft's shadow, one of those pixels down and right */
body,body *{text-shadow:.1em .1em 0 #000}
body{color:var(--text);font-family:"Minecraft",ui-monospace,monospace;font-size:20px;line-height:1.25;-webkit-font-smoothing:none}
.split{margin:0;width:440px}
.box{overflow:hidden;background:rgba(0,0,0,var(--bg-alpha))}
.head{padding:8px 12px 6px;border-bottom:2px solid var(--line);text-align:center}
.t1{font-weight:700;font-size:20px;white-space:nowrap}
.t2{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:baseline;font-size:20px}
.t2 .num{text-align:right;white-space:nowrap}
.t3{display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;gap:2px 18px;margin-top:2px;font-size:20px;white-space:nowrap}
.vs{padding:0 5px;border:2px solid var(--line)}
.vs:empty{display:none}
.vs.pace{border-color:var(--gold);color:var(--gold)}
.rows{padding:2px 0}
.r{display:grid;grid-template-columns:32px 1fr auto 90px;align-items:center;gap:8px;padding:1px 12px;min-height:34px}
.r.on{background:var(--on);color:#fff}
/* sub-splits: indented under their split, without icons and a little shorter */
.r.sub{padding-left:28px}
.r.part{padding-left:56px;color:var(--dim)}
/* (a part's sub-splits under it, in Earlygame: Any%'s, Outer End's) */
.r.sub2{padding-left:44px}
.r.blank{visibility:hidden}
.d.prog{color:var(--dim)}
/* the split it's on, when its sub-splits are open under it: gray, with the sub-split it's on in blue (as in LiveSplit) */
.r.parent{background:#3b3e46;color:#fff}
.r.parent .n{font-weight:700}
/* (the icons are 32 pixels: shown at exactly that, so every texture pixel is the same size) */
.r img{width:32px;height:32px;image-rendering:pixelated}
.r .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r .d{text-align:right;min-width:58px}
.r .tm{text-align:right}
.ahead{color:#2ee86a} .ahead-lose{color:#8fe3a9} .behind-gain{color:#f08a80} .behind{color:#ff3b30} .gold{color:var(--gold)}
/* (when the comparison's lines and the timer don't fit side by side, the timer is made smaller, see fitClock, or if
   that's not enough, goes under them) */
.detail{display:flex;flex-wrap:wrap;align-items:flex-end;gap:2px 10px;padding:6px 12px 2px}
.dl{flex:0 0 auto;display:grid;gap:2px;padding-bottom:2px}
.dc{font-size:20px;white-space:nowrap}
.t2 .st{text-align:left;color:var(--dim);font-size:20px;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.dr{text-align:right;white-space:nowrap;margin-left:auto}
.big{font-size:50px;font-weight:700;line-height:.86;font-variant-numeric:tabular-nums}
.big .ms{font-size:30px}
.big.paused{color:var(--dim)}
.seg{color:var(--dim);font-size:30px;line-height:1;margin-top:-1px;min-height:1em}
.seg .ms{font-size:20px}
.info{margin-top:6px;padding:4px 12px 8px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:1px 0;font-size:20px}
/* no scroll bars (OBS and some browsers show them when the page is a little bigger than the window); in a browser it
   still scrolls, to the settings */
*{scrollbar-width:none}
::-webkit-scrollbar{display:none;width:0;height:0}
.note{color:var(--dim);font-size:20px;padding:10px 12px;border-top:2px solid var(--line);overflow-wrap:anywhere}
.hide{display:none!important}
/* playing back a run (--replay): the slider and buttons */
.replay{border-top:2px solid var(--line);padding:10px 12px;display:grid;gap:8px;font-size:20px}
.rp-top{display:flex;justify-content:space-between;color:var(--dim)}
.replay input{width:100%;accent-color:var(--on)}
.rp-btns{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.replay button{border:0;background:var(--row);color:var(--text);font:inherit;font-size:20px;padding:4px 10px;cursor:pointer;text-shadow:inherit}
.replay button.sel,.replay button:hover{background:var(--on)}
</style>
</head>
<body>
<div class="split">
  <div class="box">
    <div class="head">
      <div class="t2"><span class="st" id="status"></span><span class="t1" id="title">AA Live</span><span class="num" id="num"></span></div>
      <div class="t3"><span id="pbT"></span><span id="wrT"></span><span class="vs" id="vsT"></span></div>
    </div>
    <div class="rows" id="rows"></div>
    <div class="detail">
      <div class="dl"><div class="dc" id="segComp"></div><div class="dc" id="segBest"></div></div>
      <div class="dr"><div class="big" id="timer">0:00:00<span class="ms">.000</span></div><div class="seg" id="segTimer"></div></div>
    </div>
    <div class="info" id="info"></div>
    <div class="replay hide" id="replay">
      <div class="rp-top"><span id="rpName"></span><span id="rpTime"></span></div>
      <input type="range" id="rpSlider" min="0" max="1" step="1000" value="0">
      <div class="rp-btns"><button id="rpPlay">Play</button><span class="rp-speeds" id="rpSpeeds"></span></div>
    </div>
  </div>
</div>
<script>
"use strict";
const $ = id => document.getElementById(id);
const P = new URLSearchParams(location.search);
// how the splits look, as set in AA Live's settings (put in by the server); a link's own ?comp=, ?ms=… still win
// (and again whenever they're changed there: in place, see relook)
const D = /*DISPLAY*/{}, LINKED = new Set(P.keys());
// (size 1: as if not set, so a phone still fits it to its width)
const mergeLook = () => { for (const k of ["comp", "ms", "rows", "scale", "bg", "clock"]) if (!LINKED.has(k)) { if (D[k] != null && !(k === "scale" && D[k] === 1)) P.set(k, String(D[k])); else P.delete(k); } };
mergeLook();
// ?app=1: in AA Live's own window (it fills the window's width, like an OBS source)
const APP = P.get("app") === "1";
// in an OBS browser source (OBS says so on the page, and in its browser's name)
const OBS = !!window.obsstudio || /\bOBS\//.test(navigator.userAgent);
// how many splits and sub-splits are listed at once: ?rows= (8 without it)
let ROWS = Math.max(2, Math.min(30, parseInt(P.get("rows")) || 8));
// the background: ?bg=0 to 100 (or 60%) makes it that much black. Without it: see-through in OBS, and black in a
// browser tab (where there's nothing behind the page)
const bgParam = parseFloat(P.get("bg"));
// (also when it's changed in the settings: without reloading the page)
const setBg = p => {
  const v = Number.isFinite(p) ? Math.min(100, Math.max(0, p)) : OBS ? 0 : 100;
  document.documentElement.style.setProperty("--bg-alpha", v / 100);
  document.documentElement.style.background = !OBS && !Number.isFinite(p) ? "#000" : "";
};
// (in a browser, all of the page is black, past the end of the splits too)
setBg(bgParam);
// (in OBS, nothing scrolls: the source shows the top of the page)
if (OBS) document.documentElement.style.overflow = "hidden";
// ?scale=1.5 makes it all that much bigger (it's 440 pixels wide at 1, or the OBS source's width)
// (without it, in a browser narrower than that, a phone say, it's made to fit)
let scale = parseFloat(P.get("scale"));
// (a phone counts the page's own width as the window's, so its screen's width is used too)
// (in OBS it fills the browser source's width, if that's wider: longer names fit)
const fit = () => {
  const w = Math.min(innerWidth, screen.width || innerWidth), z = Number.isFinite(scale) && scale > 0 ? scale : !OBS && w < 440 ? w / 440 : 1, el = document.querySelector(".split");
  el.style.zoom = z;
  el.style.width = OBS || APP ? Math.max(300, Math.floor(innerWidth / z)) + "px" : "";
};
// (again whenever the window or source changes size: OBS doesn't always say so, so it's also looked at twice a second)
let fitW = innerWidth;
const refit = () => { fitW = innerWidth; fit(); fitClock(); };
fit(); addEventListener("resize", refit);
if (window.ResizeObserver) new ResizeObserver(() => { if (innerWidth !== fitW) refit(); }).observe(document.documentElement);
setInterval(() => { if (innerWidth !== fitW) refit(); }, 500);
const cycleStore = new Map();   // (see cycle in render)
const ORDER = ["pb", "avg", "best", "worst", "wr"];
let comp = P.get("comp") || "auto";
let S = null, connected = false;

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
// 1:02:03, or 2:03 under an hour
const fmt = (ms, long) => { if (ms == null) return "—"; const s = Math.floor(Math.max(0, ms) / 1000), h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, x = String(s % 60).padStart(2, "0"); return h || long ? `${h}:${String(m).padStart(2, "0")}:${x}` : `${m}:${x}`; };
// the same with milliseconds, smaller
// (?ms= is how many decimals: 0 to 3, 3 without it)
let decimals = /^[0-3]$/.test(P.get("ms") || "") ? Number(P.get("ms")) : 3;
// the timer's digits, as in LiveSplit: ?clock=s (1, 1:23, then 1:23:45 as it grows), m (always 0:01) or h (always
// 0:00:01, without it). The split's own timer: the same, but never with the hours before it needs them.
let CLOCK = {s: "s", short: "s", m: "m"}[P.get("clock")] || "h", SEG_CLOCK = CLOCK === "h" ? "m" : CLOCK;
// The look changed in the settings: all of it again, in place (no reloading: nothing flickers)
const relook = () => {
  mergeLook();
  ROWS = Math.max(2, Math.min(30, parseInt(P.get("rows")) || 8));
  comp = P.get("comp") || "auto";
  decimals = /^[0-3]$/.test(P.get("ms") || "") ? Number(P.get("ms")) : 3;
  CLOCK = {s: "s", short: "s", m: "m"}[P.get("clock")] || "h"; SEG_CLOCK = CLOCK === "h" ? "m" : CLOCK;
  setBg(parseFloat(P.get("bg"))); scale = parseFloat(P.get("scale")); fit();
};
const digits = (ms, least) => {
  const s = Math.floor(Math.max(0, ms) / 1000), h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, x = s % 60, p = n => String(n).padStart(2, "0");
  return h || least === "h" ? `${h}:${p(m)}:${p(x)}` : m || least === "m" ? `${m}:${p(x)}` : String(x);
};
// The timers next to the comparison's lines: smaller if they don't fit beside them (down to 60%; any smaller, and they
// go under them instead, full size)
const fitClock = () => {
  const box = document.querySelector(".detail"), dl = box.querySelector(".dl"), dr = box.querySelector(".dr");
  dr.style.zoom = "";
  const room = box.clientWidth - 24 - 10 - dl.offsetWidth, need = dr.offsetWidth;
  if (need > room && room / need >= 0.6) dr.style.zoom = String(Math.floor(room / need * 100) / 100);
};
const fmtMs = (ms, least) => digits(ms, least) + (decimals ? `<span class="ms">.${String(Math.floor(Math.max(0, ms)) % 1000).padStart(3, "0").slice(0, decimals)}</span>` : "");
// a difference: −9.4 under a minute, otherwise −1:23 (or +1:02:03)
const delta = ms => (ms < 0 ? "−" : "+") + (Math.abs(ms) < 60000 ? (Math.floor(Math.abs(ms) / 100) / 10).toFixed(1) : fmt(Math.abs(ms)));
// LiveSplit's colours: ahead or behind, and gaining or losing time in that split (gold: the best that split has been)
const colour = (d, gain, gold) => gold ? "gold" : d <= 0 ? (gain ? "ahead" : "ahead-lose") : (gain ? "behind-gain" : "behind");

// Playing back a run: the slider goes to a point in it, the buttons play, pause and set the speed
const SPEEDS = [1, 10, 60, 300, 1200];
// (while it's being dragged, and for a moment after, the slider stays where it was put)
let dragging = false, held = 0, sendT = null;
const replayTo = q => fetch("/replay?" + new URLSearchParams(q)).catch(() => {});
$("rpSlider").addEventListener("input", e => {
  dragging = true; clearTimeout(sendT);
  const t = e.target.value; sendT = setTimeout(() => replayTo({t}), 120);
});
$("rpSlider").addEventListener("change", e => { clearTimeout(sendT); dragging = false; held = Date.now() + 1500; replayTo({t: e.target.value}); });
$("rpPlay").onclick = () => S && S.replay && replayTo({play: S.replay.playing ? 0 : 1});
$("rpSpeeds").innerHTML = SPEEDS.map(x => `<button data-speed="${x}">${x}×</button>`).join("");
$("rpSpeeds").onclick = e => { const b = e.target.closest("button"); if (b) replayTo({speed: b.dataset.speed}); };
const es = new EventSource("/events");
es.onmessage = e => { S = JSON.parse(e.data); connected = true;
  // (the look changed in the settings: again, with it)
  if (S.display && JSON.stringify(S.display) !== JSON.stringify(D)) { for (const k of Object.keys(D)) delete D[k]; Object.assign(D, S.display); relook(); }
  render(); };
// (paused or unpaused just now: ahead of the next full update)
es.addEventListener("quick", e => { if (S && !S.replay) { Object.assign(S, JSON.parse(e.data)); render(); } });
es.onerror = () => { connected = false; render(); };


// The IGT right now: from the latest line of the log, plus the time since then while the game is running
// (it never goes back while running: a new line from the game can be a few milliseconds behind the count)
let shown = 0;
function liveIgt() {
  if (!S) return 0;
  if (S.done || !S.anchor || !S.open) return shown = S.igt;
  if (S.paused) return shown = Math.max(S.igt, S.anchor.igt);   // (the IGT it was paused at)
  const t = Math.max(S.igt, S.anchor.igt + (Date.now() - S.anchor.wall) * (S.rate || 1));   // (rate: a run played back faster)
  return shown = t < shown && shown - t < 2000 ? shown : t;
}
// (only touches the page when something changed)
const put = (el, html) => { if (el._h !== html) { el._h = html; el.innerHTML = html; } };

function render() {
  if (!S) { $("status").textContent = connected ? "" : "Not connected"; return; }
  const best = S.comps.best, pb = S.comps.pb, wr = S.comps.wr;
  const now = liveIgt(), running = S.open && !S.paused && !S.done;
  put($("title"), esc(S.title));
  put($("num"), S.num ? "Run " + S.num : "");
  put($("pbT"), pb ? "PB: " + fmt(pb.final, true) : "");
  put($("wrT"), wr ? "WR: " + fmt(wr.final, true) : "");
  $("status").textContent = !connected ? "Not connected" : S.done ? "Done" : !S.world ? "Waiting for Minecraft" : !S.file ? "No Hermes log" : !S.open ? "World closed" : S.paused ? "Paused" : "";

  const rows = S.splits.map((r, i) => ({...r, i, cur: r.dur + (r.from != null ? Math.max(0, now - r.from) : 0)}));
  const ri = rows.findIndex(r => r.from != null);
  rows.forEach(r => { r.fin = S.done ? r.has : r.has && r.from == null && ri >= 0 && r.i < ri; r.on = r.i === ri; });
  // On PB (or WR) pace: the last split finished at or ahead of its time for it, and the one it's on not yet past its
  // (so it only changes at the end of a split, or once it falls behind in one: it doesn't flick back and forth)
  const onPace = x => {
    if (!x || !x.ends) return false;
    let ahead = null;
    for (const r of rows) {
      if (r.fin && r.end != null && x.ends[r.i] != null) ahead = r.end <= x.ends[r.i];
      if (r.on && x.ends[r.i] != null && now > x.ends[r.i]) ahead = false;
    }
    return ahead === true;
  };
  const key = comp === "auto" ? (onPace(wr) ? "wr" : onPace(pb) ? "pb" : S.comps.avg ? "avg" : "pb") : comp;
  const C = S.comps[key] || S.comps[ORDER.find(k => S.comps[k])] || null;
  // (what it's compared with, at the top: "auto" says so, and stands out on PB pace)
  const vs = $("vsT");
  const short = C ? (C.short === "Average" ? "Avg" : C.short) : "";
  put(vs, C ? (comp === "auto" ? "Auto: " : "vs ") + esc(short) : "");
  vs.classList.toggle("pace", comp === "auto" && !!C && (C === pb || C === wr));
  const c = i => C && C.splits[i] != null ? C.splits[i] : null, b = i => best && best.splits[i] != null ? best.splits[i] : null;
  const ce = i => C && C.ends && C.ends[i] != null ? C.ends[i] : null;
  // a running split's delta shows once it's behind, or in the minute before it goes behind (the minus, about to go red)
  const soon = d => d > -60000;

  // each finished split: how far ahead or behind at its end (its split time against the comparison's)
  let prevD = 0;
  rows.forEach(r => { if (r.fin && ce(r.i) != null) { r.d = r.end - ce(r.i); r.gain = r.d <= prevD; prevD = r.d; } });

  // What's listed: each split; under the one it's on, its sub-splits (done whenever their step happens, in any order).
  // Post-endgame only when the run has one.
  const cs = (i, j) => C && C.subs && C.subs[i] && C.subs[i][j] != null ? C.subs[i][j] : null;
  // how long a step took: the comparison's, and the fastest ever (gold)
  const cd = (i, j) => C && C.subDurs && C.subDurs[i] && C.subDurs[i][j] != null ? C.subDurs[i][j] : null;
  const bd = (i, j) => best && best.subDurs && best.subDurs[i] && best.subDurs[i][j] != null ? best.subDurs[i][j] : null;
  let onSub = null;   // the step it's on: {cur, i, j}, or {cur, mid: key} for a Midgame checklist split
  // the Midgame checklist's splits: the comparison's length, and the fastest
  // (compared with what the rest is, or with the average where that run hasn't got one, as a PB often hasn't): [time, its name]
  const AVG = S.comps.avg || C;
  const midCmp = k => C && C.mid && C.mid[k] != null ? [C.mid[k], C.short] : AVG && AVG.mid && AVG.mid[k] != null ? [AVG.mid[k], AVG.short] : [null, ""];
  const mb = k => best && best.mid && best.mid[k] != null ? best.mid[k] : null;
  // Under Midgame, the checklist for the kind of place the runner is in (MIDGAME on the stats site; places they left a
  // few seconds ago still count): its splits (shown for a minute after they finish), and its counters. The split it's on
  // (in its area, or being worked on now) is the blue one, with what's left of it under it. Under Post-endgame, what of
  // the checklist is still not done.
  const midgame = rows[3] && rows[3].mid, extra = Math.max(0, now - S.igt);   // (extra: live time since the server worked it out)
  // (a checklist item's icon: an item, or one of the stats site's own, like "mh:zoglin")
  // (the stats site's own icons are under "item:icon:<name>", like the rest of the checklist's: see build.mjs)
  const iconOf = it => it.startsWith("icon:") || !it.includes(":") ? "item:" + it : it;
  // Going through icons (what's still needed for a split), a new one every 1.5 seconds, in a random order that keeps
  // going where it was when something's done or the page redraws
  const cycles = cycleStore;
  const cycle = (key, list) => {
    let c = cycles.get(key);
    if (!c) { c = {order: [], i: 0, at: Date.now()}; cycles.set(key, c); }
    const want = new Set(list), now = Date.now();
    c.order = c.order.filter(x => want.has(x));
    for (const x of list) if (!c.order.includes(x)) c.order.splice(Math.floor(Math.random() * (c.order.length + 1)), 0, x);
    if (now - c.at >= 1500) { c.i += Math.floor((now - c.at) / 1500); c.at = now; }
    if (c.i >= c.order.length) {   // (round again: a new order, not starting on the one just shown)
      const last = c.order[c.order.length - 1];
      for (let k = c.order.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [c.order[k], c.order[j]] = [c.order[j], c.order[k]]; }
      if (c.order.length > 1 && c.order[0] === last) c.order.push(c.order.shift());
      c.i = 0;
    }
    return c.order[c.i];
  };
  // tk: the main split it's under (1 Midgame, 2 Endgame: only Debris, if it's done then, 3 Post-endgame); cap: how many
  // rows there's room for (Midgame: what's left of the checklist fills the rest)
  const checklist = (tk, cap = 0) => {
    if (!midgame) return [];
    const out = [], near = midgame.near || [midgame.area];
    // (Debris: under the main split it's done in, see splits.js; before it's started, a count in Midgame)
    const debrisHere = x => x.key !== "debris" || (x.split ? x.in === tk : tk === 1);
    {
      // (a split that's just finished shows for a minute, wherever they are, so its final time can be seen; Debris is
      // under the Debris split)
      const justDone = x => x.split && x.complete && S.igt - x.end < 60000;
      const recent = x => x.split && x.end == null && x.last != null && S.igt - x.last < 120000;
      const now2 = x => x.split && x.end == null && x.last != null && S.igt - x.last < 20000;
      // (Temperate, the least of them: only while something's being done for it)
      // (Adventuring Time: not until enough rare biomes have been gone to, then wherever they are: hidden, pin)
      const shown = tk === 2 ? midgame.sections.filter(x => x.key === "debris" && x.split && x.in === 2 && (x.end == null || justDone(x) || recent(x)))
        : midgame.sections.filter(x => debrisHere(x) && !x.hidden && (justDone(x) || now2(x) || (x.pin && x.end == null && x.start != null) || x.key !== "animals" && x.area.some(a => near.includes(a))
        && (x.split ? x.end == null && x.start != null : x.need == null ? x.have > 0 : x.done == null)));   // (not started yet, like Nether Misc while farming skulls: not shown; done, and ends on leaving: still up until then)
      // in order: just finished; something done for it in the last 20 seconds (a shell picked up, a drowned or a ghast
      // killed: straight away, wherever they are); the area they're in, what was worked on in the last 2 minutes first
      // (in the Nether, Nether Misc first after that); then the rest, the same way
      const here = x => x.area.includes(midgame.area);
      // (underwater in the last 10 seconds, in the ocean: the shells first, or the trident once they're done)
      // (from the ghost file while playing: swimming or below sea level; or else seagrass or kelp broken, drowned killed)
      const wet = midgame.area === "ocean" && (S.wet || (midgame.underwater != null && S.igt - midgame.underwater < 10000));
      const wetKey = wet ? ["shells", "trident"].find(k => { const y = midgame.sections.find(z => z.key === k); return y && y.split && y.end == null; }) : null;
      const rank = x => justDone(x) ? 0 : now2(x) ? 1 : x.key === wetKey ? 1.5 : here(x) ? (recent(x) ? 2 : x.key === "nethermisc" ? 3 : 4) : x.pin ? 7 : recent(x) ? 5 : 6;
      shown.sort((a, b) => rank(a) - rank(b) || ([0, 1, 2, 5].includes(rank(a)) ? (b.end ?? b.last ?? 0) - (a.end ?? a.last ?? 0) : 0));
      // (the one it's on: the first not finished)
      const focus = shown.find(x => x.split && x.end == null && (!x.pin || now2(x) || here(x))) || null;
      // (nothing for the checklist where they are, outside Midgame: just the split, with its time in the comparison)
      if (tk === 2 && !focus && !shown.some(x => justDone(x) || x.pin)) return out;
      for (const x of shown) {
        // (not timed: what's left of it)
        const info = () => { for (const [n, ic, v] of x.info || []) out.push({cls: "sub part", icon: ic, name: n, d: v, dc: "prog", tm: ""}); };
        if (!x.split) { out.push({cls: "sub", icon: iconOf(x.item), name: x.name, d: x.need == null ? String(x.have) : `${x.have}/${x.need}`, dc: "prog", tm: ""}); info(); continue; }
        const live = x.end == null && x.since != null, cur = (x.dur || 0) + (live ? extra : 0), [cmp] = midCmp(x.key);
        let d, dc;
        if (x.complete && cmp != null) { d = delta(cur - cmp); dc = colour(cur - cmp, true, mb(x.key) != null && cur < mb(x.key)); }
        else if (x.end == null && cmp != null && soon(cur - cmp, cmp)) { d = delta(cur - cmp); dc = colour(cur - cmp, false); }
        else { d = x.need > 1 ? `${x.have}/${x.need}` : ""; dc = "prog"; }
        const on = x === focus;
        if (on && !onSub) onSub = {mid: x.key, cur};
        // (a misc split, Adventuring Time or Cats lower down the list: its icon goes through what's still needed; the one
        // it's on keeps its own, with its groups under it doing that)
        // (nor one whose only group says the same as its row, Cats 5/11 or Adventuring Time's biomes: then its own icon
        // goes through what's left, as there's nothing under it to)
        const same = x.parts && x.parts.length === 1 && x.parts[0][1] === x.have && x.parts[0][2] === x.need;
        const needIcons = x.end == null && (on ? same : x.time === "active" || x.pin) ? (x.parts || []).flatMap(p => p[3] || []).map(iconOf) : [];
        // (its time: how long it took, once it's done; until then, how long the comparison's took, as the splits above
        // show the comparison's until they're done. The time on it so far is the timer under the list.)
        out.push({cls: "sub" + (on ? " on" : ""), icon: needIcons.length ? cycle(x.key + "|row", needIcons) : iconOf(x.item), name: x.name, d, dc, tm: x.complete ? fmt(cur) : cmp != null ? fmt(cmp) : "—"});
        // (what's left of it: "Biomes 3/5", "Foods 1/2", the rest by name)
        // (each with the icon of something missing in it, taking turns)
        info();
        // (more to do alongside it, not timed: Snowy's "While Curing", the icons of what's left taking turns)
        // (Snowy's Zombie Doctor: with what's often done while curing, its count and its icons, on its own line: see extra)
        // (and Snowy's only kill, the stray, in it too, rather than a line of its own)
        const kills = on && x.extra ? (x.parts || []).find(p => p[0] === "Kills") : null;
        const xh = x.extra ? x.extra[1] + (kills ? kills[1] : 0) : 0, xn = x.extra ? x.extra[2] + (kills ? kills[2] : 0) : 0, xi = x.extra ? [...x.extra[3], ...(kills ? kills[3] : [])] : [];
        const extraRow = on && x.extra && (x.extra[1] < x.extra[2] || kills) ? {cls: "sub part", icon: xi.length ? cycle(x.key + "|extra", xi) : null, name: x.extra[0], d: `${xh}/${xn}`, dc: "prog", tm: ""} : null;
        let extraPut = false;
        // (one group only too, when it has several things missing to go through: "Biomes 2/6")
        // (but not one that just says the same as the split's own row: Cats 5/11 under Cats 5/11)
        if (on && x.parts && !same && (x.parts.length > 1 || (x.parts[0] && x.parts[0][3] && x.parts[0][3].length > 1))) for (const [n, h, k, icons] of x.parts) {
          const ic = icons && icons.length ? cycle(x.key + "|" + n, icons.map(iconOf)) : null;
          if (extraRow && n === extraRow.name) { out.push(extraRow); extraPut = true; continue; }
          if (extraRow && kills && n === "Kills") continue;
          out.push({cls: "sub part", icon: ic, name: n, d: k > 1 ? `${h}/${k}` : "", dc: "prog", tm: ""});
        }
        if (extraRow && !extraPut) out.push(extraRow);   // (Zombie Doctor all that's left: on its own)
      }
      // Midgame and Post-endgame: the rest of what's left of the checklist, in the rows there's room for (with the
      // comparison's time for it; in Post-endgame, all of it, even what's hidden until later in Midgame)
      if (tk === 1 || tk === 3) for (const x of midgame.sections) {
        if (out.length >= cap) break;
        if (shown.includes(x) || (x.hidden && tk === 1) || !debrisHere(x) || !(x.split ? x.end == null : x.need != null && x.done == null)) continue;
        const [cmp] = midCmp(x.key);
        out.push({cls: "sub", icon: iconOf(x.item), name: x.name, d: x.need > 1 ? `${x.have}/${x.need}` : "", dc: "prog", tm: cmp != null ? fmt(cmp) : ""});
      }
    }
    return out;
  };
  // The list: the main splits (S.top: Earlygame, Midgame, Endgame, Post-endgame), and under the one it's on what's in
  // it: Earlygame's parts (Any%, Outer End, Enchanting; Any% and Outer End with their sub-splits under them while
  // they're on), Midgame's checklist, Endgame's sub-splits; Debris under the one it's done in. Post-endgame only when
  // the run has one.
  const tops = S.top.map((r, k) => ({...r, k, cur: r.dur + (r.from != null ? Math.max(0, now - r.from) : 0)}));
  const ti = tops.findIndex(r => r.from != null);
  tops.forEach(r => { r.fin = S.done ? r.has : r.has && r.from == null && ti >= 0 && r.k < ti; r.on = r.k === ti; });
  const tc = k => C && C.tsplits && C.tsplits[k] != null ? C.tsplits[k] : null, tb = k => best && best.tsplits && best.tsplits[k] != null ? best.tsplits[k] : null;
  const tce = k => C && C.tends && C.tends[k] != null ? C.tends[k] : null;
  let tprev = 0;
  tops.forEach(r => { if (r.fin && tce(r.k) != null) { r.d = r.end - tce(r.k); r.gain = r.d <= tprev; tprev = r.d; } });
  // a part's (rows: Any%, Outer End, Enchanting, Endgame's) sub-splits, the next one not done yet the one it's on
  const subRows = (r, cls) => {
    const out = [];
    let pd = r.i > 0 && rows[r.i - 1].d != null ? rows[r.i - 1].d : 0;
    const next = r.subs.findIndex(x => x.t == null);
    // (the step it's on started when the last step before it was done, or with the split)
    if (r.on && next >= 0) onSub = {i: r.i, j: next, cur: now - Math.max(r.start ?? 0, ...r.subs.slice(0, next).map(x => x.t).filter(t => t != null))};
    r.subs.forEach((x, j) => {
      const cmp = cs(r.i, j);
      let sd = "", sc = "";
      if (x.t != null && cmp != null) { const v = x.t - cmp; sd = delta(v); sc = colour(v, v <= pd, x.dur != null && bd(r.i, j) != null && x.dur < bd(r.i, j)); pd = v; }
      else if (r.on && j === next && cmp != null && soon(now - cmp, cd(r.i, j))) { const v = now - cmp; sd = delta(v); sc = colour(v, v <= pd); }
      out.push({cls: cls + (r.on && j === next ? " on" : ""), icon: x.item ? "item:" + x.item : null, name: x.name, d: sd, dc: sc, tm: fmt(x.t != null ? x.t : cmp)});
    });
    return out;
  };
  // (room for Midgame's checklist: the rows but Earlygame's, Midgame's and the ones after it)
  const after = tops.filter(r => r.k > 1 && (r.k < 3 || r.has || r.on)).length;
  const list = [];
  for (const r of tops) {
    if (r.k === 3 && !r.has && !r.on) continue;
    let d = "", dc = "";
    if (r.d != null) { d = delta(r.d); dc = colour(r.d, r.gain, tb(r.k) != null && r.cur < tb(r.k)); }
    else if (r.on && tce(r.k) != null && soon(now - tce(r.k), tc(r.k))) { const x = now - tce(r.k); d = delta(x); dc = colour(x, x <= tprev); }
    let more = [];
    if (r.on && r.k === 0) {
      // Earlygame: Any%, Outer End and Enchanting; the one it's on gray with its sub-splits under it (blue: the one it's on)
      for (const p of rows.slice(0, 3)) {
        let pd2 = "", pc2 = "";
        if (p.d != null) { pd2 = delta(p.d); pc2 = colour(p.d, p.gain, b(p.i) != null && p.cur < b(p.i)); }
        else if (p.on && ce(p.i) != null && soon(now - ce(p.i), c(p.i))) { const x = now - ce(p.i); pd2 = delta(x); pc2 = colour(x, x <= prevD); }
        const openP = p.on && p.subs && p.subs.length;
        more.push({cls: "sub" + (openP ? " parent" : p.on ? " on" : ""), icon: p.icon, name: p.name, d: pd2, dc: pc2, tm: fmt(p.fin ? p.end : ce(p.i))});
        if (openP) more.push(...subRows(p, "sub2"));
      }
    }
    else if (r.on && r.k === 1) more = checklist(1, Math.max(0, ROWS - 2 - after));
    else if (r.on && r.k === 2) more = [...(rows[5].subs && rows[5].subs.length ? subRows({...rows[5], on: !rows[4].on}, "sub") : []), ...checklist(2)];
    else if (r.on && r.k === 3) more = checklist(3, ROWS - 2);
    const open = more.length > 0;
    // (Post-endgame: a nether star until it starts; while it's on, the advancements still to get, taking turns; once
    // it's done, the last one's)
    const icon = r.k !== 3 || r.fin || S.done ? r.icon : r.on && r.left ? cycle("post", r.left.filter(k => S.icons[k])) || "star" : "star";
    list.push({cls: r.on && !open ? "on" : open ? "parent" : "", icon, name: r.name, d, dc, tm: fmt(r.fin ? r.end : tce(r.k))});
    list.push(...more);
  }
  // Only ROWS of them at once, like LiveSplit: the one it's on with the next one under it, moving down as it goes
  // (empty rows keep the size the same)
  // (with nothing running under the split it's on, that split goes near the top, with as much as fits under it)
  let at = list.findIndex(x => / on\b|^on\b/.test(x.cls));
  const parent = list.findIndex(x => x.cls === "parent");
  // (Midgame's checklist: from Midgame down, as much as fits, as long as the one it's on still shows)
  let from = Math.max(0, Math.min(at >= 0 ? at - (ROWS - 2) : parent >= 0 ? parent - 1 : list.length, list.length - ROWS));
  if (ti === 1 && parent >= 0) from = Math.max(0, Math.min(parent - 1, list.length - ROWS, at >= 0 ? at - 1 : Infinity));
  const shownRows = list.slice(from, from + ROWS);
  while (shownRows.length < ROWS) shownRows.push({cls: "blank", icon: null, name: "", d: "", dc: "", tm: ""});
  // (the rows are made once and then only changed, so the icons don't flicker)
  const box = $("rows");
  while (box.children.length < shownRows.length) box.insertAdjacentHTML("beforeend", `<div class="r"><img alt=""><span class="n"></span><span class="d"></span><span class="tm"></span></div>`);
  while (box.children.length > shownRows.length) box.lastChild.remove();
  shownRows.forEach((x, k) => {
    const el = box.children[k], [img, n, de, tm] = el.children;
    const src = x.icon && S.icons[x.icon] || "";
    if (img.getAttribute("src") !== src) { if (src) img.setAttribute("src", src); else img.removeAttribute("src"); }
    img.style.visibility = src ? "" : "hidden";
    el.className = "r " + x.cls;
    n.textContent = x.name; de.textContent = x.d; de.className = "d " + x.dc; tm.textContent = x.tm;
  });

  // what's left, going by the comparison (pace) and by the best segments (best possible time)
  // the split it's on, by its sub-splits: what the comparison took for each step not done yet (less the time on it so
  // far), and for the time between steps what's left of its; a step done faster or slower than usual counts straight
  // away, not at the end of the split. (fd: the comparison's step durations. Without them all, or for Midgame, whose
  // checklist splits overlap and don't add up to it: the whole split, as below)
  const leftOn = (r, f, fd) => {
    const whole = Math.max(0, (f(r.i) ?? 0) - r.cur);
    if (f(r.i) == null) return whole;
    let parts = null;
    if (r.subs && r.subs.length) {
      const next = r.subs.findIndex(x => x.t == null);
      parts = r.subs.map((x, j) => ({D: fd(r.i, j), done: x.t != null, cur: x.t != null ? x.dur ?? 0 : j === next && onSub && onSub.i === r.i ? onSub.cur : 0}));
    }
    if (!parts || !parts.length || parts.some(p => !p.done && p.D == null)) return whole;
    const tail = Math.max(0, f(r.i) - parts.reduce((a, p) => a + (p.D ?? p.cur), 0)), between = Math.max(0, r.cur - parts.reduce((a, p) => a + p.cur, 0));
    return parts.filter(p => !p.done).reduce((a, p) => a + Math.max(0, p.D - p.cur), 0) + Math.max(0, tail - between);
  };
  const left = (f, fd) => rows.filter(r => !r.fin).reduce((a, r) => a + (r.on ? leftOn(r, f, fd) : Math.max(0, (f(r.i) ?? 0) - r.cur)), 0);
  const possible = best ? now + left(b, bd) : null;
  // Pace: what's left going by all the runs (S.comps.pace: each split's and step's times in each run). For what isn't
  // started, their average; for what's under way, the average of what the runs that took longer than that still needed
  // (a split that's going slowly usually goes on being slow).
  const PC = S.comps.pace;
  const mean = xs => xs && xs.length ? xs.reduce((a, d) => a + d, 0) / xs.length : 0;
  // (nothing of it yet: all the runs, those that hadn't this split too)
  const rest = (xs, cur) => cur > 0 ? mean((xs || []).filter(d => d > cur).map(d => d - cur)) : mean(xs);
  const paceOn = r => {
    const xs = PC.splits[r.i], steps = PC.subs[r.i];
    // (by its steps, as for the best possible time; not Midgame, whose checklist splits overlap)
    if (r.mid || !r.subs || !r.subs.length || !steps || r.subs.some((x, j) => !(steps[j] && steps[j].length))) return rest(xs, r.cur);
    const next = r.subs.findIndex(x => x.t == null);
    let left = 0, used = 0;
    r.subs.forEach((x, j) => { const cur = x.t != null ? x.dur ?? 0 : j === next && onSub && onSub.i === r.i ? onSub.cur : 0; used += cur; if (x.t == null) left += rest(steps[j], cur); });
    const tail = Math.max(0, mean(xs) - steps.reduce((a, st) => a + mean(st), 0)), between = Math.max(0, r.cur - used);
    return left + Math.max(0, tail - between);
  };
  const pace = PC ? now + rows.filter(r => !r.fin).reduce((a, r) => a + (r.on ? paceOn(r) : rest(PC.splits[r.i], r.cur)), 0) : null;
  const on = rows[ri];
  const t = $("timer");
  put(t, fmtMs(now, CLOCK));
  fitClock();
  // (its colour: the split it's on, once that shows a time, else the last finished)
  const liveD = on && ce(on.i) != null && soon(now - ce(on.i), c(on.i)) ? now - ce(on.i) : prevD;
  t.className = "big " + (S.done ? (pb && now < pb.final ? "gold" : C && C.final != null ? colour(now - C.final, true) : "") : !running ? "paused" : C ? colour(liveD, true) : "");
  // the split it's on (or the step of it, when it has sub-splits): its time so far, and the comparison's and the best
  const segCur = onSub ? onSub.cur : on ? on.cur : null;
  // (a Midgame checklist split: the comparison's own time for it, though its delta in the list is against Average)
  const segC = onSub ? (onSub.mid ? midCmp(onSub.mid)[0] : cd(onSub.i, onSub.j)) : on ? c(on.i) : null;
  const segB = onSub ? (onSub.mid ? mb(onSub.mid) : bd(onSub.i, onSub.j)) : on ? b(on.i) : null;
  put($("segTimer"), segCur != null ? fmtMs(segCur, SEG_CLOCK) : "");
  const segName = onSub && onSub.mid ? midCmp(onSub.mid)[1] || (C ? C.short : "") : C ? C.short : "";
  put($("segComp"), C && on && key !== "best" ? `${esc(segName)}: ${segC != null ? fmt(segC) : "—"}` : "");
  put($("segBest"), on && best ? `Best: ${segB != null ? fmt(segB) : "—"}` : "");

  const kv = (k, v, cl = "") => `<div class="kv"><span>${k}</span><span class="${cl}">${v}</span></div>`;
  // (all of them always there, "—" until there's something, so the page is always the same height: for cropping in OBS)
  let info = "";
  // (a finished run: its final time)
  info += kv("Current Pace", S.done ? fmt(now, true) : pace != null ? fmt(pace, true) : "—");
  info += kv("Best Possible Time", S.done ? fmt(now, true) : possible != null ? fmt(possible, true) : "—");
  info += kv("Sum of Best Segments", best ? fmt(best.final, true) : "—");
  put($("info"), info);

  // (playing back a run)
  const rp = S.replay, rpOn = !!rp && !OBS;
  $("replay").classList.toggle("hide", !rpOn);
  if (rpOn) {
    $("rpName").textContent = rp.name; $("rpTime").textContent = `${fmt(now, true)} / ${fmt(rp.total, true)}`;
    const sl = $("rpSlider"); sl.max = rp.total; if (!dragging && Date.now() > held) sl.value = Math.min(rp.total, now);
    $("rpPlay").textContent = rp.playing ? "Pause" : "Play";
    for (const b of $("rpSpeeds").children) b.classList.toggle("sel", +b.dataset.speed === rp.speed);
  }
}
// every frame (for the milliseconds)
const frame = () => { render(); requestAnimationFrame(frame); };
requestAnimationFrame(frame);
</script>
</body>
</html>
