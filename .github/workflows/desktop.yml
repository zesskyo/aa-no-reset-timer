# Builds the AA Live app (desktop/): an installer for Windows, a .dmg for Mac and an AppImage for Linux, from the
# timer's code and the stats site's (zesskyo/aa-stats). Run by hand, it keeps them as the run's artifacts (or, given a
# version, makes that tag and a release with them); on a pushed version tag (v1.2.0), it makes a release with them.
name: Build the AA Live app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Make a release with them: its version tag (v1.0.0), or empty for just the artifacts"
        required: false
        default: ""
      notes:
        description: "What changed: a Markdown list"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: zesskyo/aa-stats
          path: aa-stats
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the timer
        run: node build.mjs aa-stats
      - name: Build the app
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"   # (not signed)
        run: |
          npm ci
          npx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: AA-Live-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
          if-no-files-found: error
      - name: Add to the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: AA Live ${{ inputs.release || github.ref_name }}
          body: |
            **Changes**

            ${{ inputs.notes }}

            **Download**

            - Windows: `…-win.exe` · Mac: `…-mac.dmg` · Linux: `…-linux.AppImage`
            - Already installed: it updates itself
            - Setup: [Getting it](https://github.com/zesskyo/aa-no-reset-timer#getting-it)
          # (latest*.yml and the .blockmap: what the app's updater reads)
          files: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*-mac.zip
            desktop/dist/*.AppImage
            desktop/dist/*.blockmap
            desktop/dist/latest*.yml
