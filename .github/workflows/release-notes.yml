# Changes a release's notes (what its page says), without building anything again: run by hand from the Actions tab.
name: Release notes

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The release's version tag (v1.1.1)"
        required: true
      notes:
        description: "What changed: a Markdown list"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}   # (only used for a new tag: an existing one stays where it is)
          make_latest: false   # (an older release stays older)
          body: |
            **Changes**

            ${{ inputs.notes }}

            **Download**

            - Windows: `…-win.exe` · Mac: `…-mac.dmg` · Linux: `…-linux.AppImage`
            - Already installed: it updates itself
            - Setup: [Getting it](https://github.com/zesskyo/aa-no-reset-timer#getting-it)
